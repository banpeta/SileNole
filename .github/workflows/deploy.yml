name: Desplegar en GitHub Pages

on:
  push:
    branches:
      - master
      - claude/football-stickers-tracker-app-y9g81g
  workflow_dispatch:

# Permisos necesarios para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancelar uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Config de Supabase para la sincronizacion (Fase 7). Son secrets del
          # repo. Si faltan, el build sale igual y la sync queda desactivada
          # (la app funciona en modo local). La clave publishable/anon es publica
          # por diseno (viaja en el bundle del cliente).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Evita el procesado Jekyll (por si hubiera archivos con "_").
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
